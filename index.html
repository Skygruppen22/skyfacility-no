<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sky Facility</title>
  <meta name="description" content="Sky Facility" />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, #dbeafe 0%, transparent 50%),
                  radial-gradient(900px 500px at 90% 20%, #e0e7ff 0%, transparent 45%),
                  #0b1220;
      color: #e8eefc;
    }
    main {
      width: min(640px, 92vw);
      padding: 2.5rem;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      background: rgba(15, 23, 42, .72);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 .5rem; font-size: clamp(1.8rem, 4vw, 2.4rem); letter-spacing: -.02em; }
    p { margin: 0; line-height: 1.6; color: #b6c2dc; }
    .badge {
      display: inline-block; margin-bottom: 1rem; padding: .35rem .7rem;
      border-radius: 999px; font-size: .8rem; font-weight: 600;
      background: rgba(59,130,246,.18); color: #93c5fd; border: 1px solid rgba(147,197,253,.25);
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">skyfacility.no</div>
    <h1>Sky Facility</h1>
    <p>Domenet er aktivt. Nettside hostes gratis via GitHub Pages med SSL. E-post fortsetter via Microsoft 365.</p>
  </main>
</body>
</html>
